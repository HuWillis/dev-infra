name: dev-infra

x-defaults: &defaults
  # A consistent baseline for Intel/AMD hosts and Apple Silicon via emulation.
  platform: ${DOCKER_PLATFORM:-linux/amd64}
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mysql:
    <<: *defaults
    image: mysql:8.0.44
    networks:
      default:
        ipv4_address: 172.18.0.10
    mem_limit: 1g
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run infra.ps1 Init first}
      MYSQL_USER: ${MYSQL_USER:?Run infra.ps1 Init first}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run infra.ps1 Init first}
      MYSQL_DATABASE: dev
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-connections=100"]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    <<: *defaults
    image: redis:7.4.7-alpine
    networks:
      default:
        ipv4_address: 172.18.0.11
    mem_limit: 384m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run infra.ps1 Init first}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

  rabbitmq:
    <<: *defaults
    image: rabbitmq:3.13.7-management
    networks:
      default:
        ipv4_address: 172.18.0.12
    profiles: [messaging]
    hostname: dev-rabbitmq
    mem_limit: 768m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Run infra.ps1 Init first}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Run infra.ps1 Init first}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  nacos:
    <<: *defaults
    image: nacos/nacos-server:v2.4.3
    networks:
      default:
        ipv4_address: 172.18.0.13
    profiles: [registry]
    mem_limit: 1g
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "127.0.0.1:${NACOS_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  minio:
    <<: *defaults
    image: dev-infra/minio:RELEASE.2025-04-22T22-12-26Z
    networks:
      default:
        ipv4_address: 172.18.0.14
    build: ./minio
    pull_policy: build
    profiles: [storage]
    mem_limit: 768m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run infra.ps1 Init first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run infra.ps1 Init first}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  elasticsearch:
    <<: *defaults
    image: elasticsearch:${ELASTIC_VERSION:-8.19.8}
    profiles: [search]
    networks:
      default:
        ipv4_address: 172.18.0.15
    mem_limit: 1536m
    environment:
      discovery.type: single-node
      cluster.name: dev-infra
      xpack.security.enabled: "true"
      xpack.security.autoconfiguration.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      # Small development instance; avoids changing the WSL host's vm.max_map_count.
      node.store.allow_mmap: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Run infra.ps1 Init first}
    ports:
      - "127.0.0.1:${ELASTIC_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"elastic:$$ELASTIC_PASSWORD\" 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  mongodb:
    <<: *defaults
    image: mongo:${MONGO_VERSION:-8.0.17}
    profiles: [document]
    networks:
      default:
        ipv4_address: 172.18.0.16
    mem_limit: 768m
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Run infra.ps1 Init first}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run infra.ps1 Init first}
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  rocketmq-namesrv:
    <<: *defaults
    image: apache/rocketmq:${ROCKETMQ_VERSION:-5.3.2}
    user: "0:0"
    entrypoint: ["sh", "/etc/rocketmq/entrypoint.sh"]
    profiles: [rocketmq]
    networks:
      default:
        ipv4_address: 172.18.0.17
    mem_limit: 512m
    environment:
      JAVA_OPT_EXT: -Xms128m -Xmx256m -Xmn64m
    command: ["sh", "mqnamesrv"]
    ports:
      - "127.0.0.1:${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    volumes:
      - ./rocketmq/entrypoint.sh:/etc/rocketmq/entrypoint.sh:ro
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/9876"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  rocketmq-broker:
    <<: *defaults
    image: apache/rocketmq:${ROCKETMQ_VERSION:-5.3.2}
    user: "0:0"
    entrypoint: ["sh", "/etc/rocketmq/entrypoint.sh"]
    profiles: [rocketmq]
    networks:
      default:
        ipv4_address: 172.18.0.18
    mem_limit: 1536m
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: -Xms256m -Xmx512m -Xmn128m -XX:MaxDirectMemorySize=256m
      ROCKETMQ_BROKER_IP: ${ROCKETMQ_BROKER_IP:-127.0.0.1}
      ROCKETMQ_BROKER_PORT: ${ROCKETMQ_BROKER_PORT:-10911}
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    command:
      - bash
      - -ec
      - |
        cp /etc/rocketmq/broker.conf /tmp/dev-broker.conf
        printf '\nbrokerIP1=%s\nlistenPort=%s\n' "$$ROCKETMQ_BROKER_IP" "$$ROCKETMQ_BROKER_PORT" >> /tmp/dev-broker.conf
        exec sh mqbroker --enable-proxy -c /tmp/dev-broker.conf
    ports:
      # The advertised broker port must equal its host port for Windows clients.
      - "127.0.0.1:${ROCKETMQ_BROKER_PORT:-10911}:${ROCKETMQ_BROKER_PORT:-10911}"
      - "127.0.0.1:${ROCKETMQ_FAST_PORT:-10909}:${ROCKETMQ_FAST_PORT:-10909}"
      - "127.0.0.1:${ROCKETMQ_PROXY_REMOTING_PORT:-18080}:8080"
      - "127.0.0.1:${ROCKETMQ_PROXY_GRPC_PORT:-18081}:8081"
      - "127.0.0.1:${ROCKETMQ_DASHBOARD_PORT:-19876}:8082"
    volumes:
      - ./rocketmq/broker.conf:/etc/rocketmq/broker.conf:ro
      - ./rocketmq/entrypoint.sh:/etc/rocketmq/entrypoint.sh:ro
      - rocketmq-store:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'echo > /dev/tcp/127.0.0.1/$$ROCKETMQ_BROKER_PORT; echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s


  nginx:
    <<: *defaults
    image: nginx:${NGINX_VERSION:-1.28.0}-alpine
    profiles: [web]
    networks:
      default:
        ipv4_address: 172.18.0.19
    mem_limit: 128m
    environment:
      JAVA_APP_PORT: ${JAVA_APP_PORT:-8080}
      NGINX_ENVSUBST_FILTER: JAVA_APP_PORT
    ports:
      - "127.0.0.1:${NGINX_PORT:-18000}:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

  xxl-job:
    <<: *defaults
    image: xuxueli/xxl-job-admin:${XXL_JOB_VERSION:-3.2.0}
    profiles: [scheduler]
    networks:
      default:
        ipv4_address: 172.18.0.20
    mem_limit: 768m
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/devinfra_xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: dev_xxl_job
      SPRING_DATASOURCE_PASSWORD: ${XXL_JOB_DB_PASSWORD:?Run infra.ps1 Init first}
      XXL_JOB_ACCESSTOKEN: ${XXL_JOB_ACCESS_TOKEN:?Run infra.ps1 Init first}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${XXL_JOB_PORT:-18082}:8080"
    volumes:
      - xxl-job-logs:/data/applogs
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /xxl-job-admin/auth/login HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS= read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 15s
      timeout: 5s
      retries: 16
      start_period: 30s

  kibana-setup:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: elasticsearch:${ELASTIC_VERSION:-8.19.8}
    profiles: [search-ui]
    restart: "no"
    mem_limit: 256m
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Run infra.ps1 Init first}
      KIBANA_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?Run infra.ps1 Init first}
    depends_on:
      elasticsearch:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        curl --fail --silent --show-error -u "elastic:$$ELASTIC_PASSWORD" \
          -H 'Content-Type: application/json' -X POST \
          http://elasticsearch:9200/_security/user/kibana_system/_password \
          --data "{\"password\":\"$$KIBANA_PASSWORD\"}"

  kibana:
    <<: *defaults
    image: kibana:${ELASTIC_VERSION:-8.19.8}
    profiles: [search-ui]
    networks:
      default:
        ipv4_address: 172.18.0.21
    mem_limit: 1g
    environment:
      SERVER_HOST: 0.0.0.0
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?Run infra.ps1 Init first}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SECURITY_KEY:?Run infra.ps1 Init first}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_SAVED_OBJECTS_KEY:?Run infra.ps1 Init first}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_KEY:?Run infra.ps1 Init first}
      NODE_OPTIONS: --max-old-space-size=768
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana-setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    volumes:
      - kibana-data:/usr/share/kibana/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/login >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 24
      start_period: 60s

  rocketmq-dashboard:
    <<: *defaults
    image: apacherocketmq/rocketmq-dashboard:${ROCKETMQ_DASHBOARD_VERSION:-2.1.0}
    profiles: [rocketmq-ui]
    # The broker advertises loopback to Windows clients. Sharing its network also
    # lets Dashboard reach that same loopback address; UI port is on the broker.
    network_mode: service:rocketmq-broker
    mem_limit: 768m
    environment:
      JAVA_OPTS: >-
        -Xms128m -Xmx384m
        -Dserver.port=8082
        -Drocketmq.config.namesrvAddrs[0]=rocketmq-namesrv:9876
        -Drocketmq.config.proxyAddrs[0]=127.0.0.1:8080
        -Drocketmq.config.isVIPChannel=false
        -Drocketmq.config.loginRequired=true
        -Drocketmq.config.authMode=file
        -Drocketmq.config.dataPath=/tmp/rocketmq-console/data
    depends_on:
      rocketmq-broker:
        condition: service_healthy
        restart: true
    volumes:
      - ./.runtime/rocketmq-dashboard/users.properties:/tmp/rocketmq-console/data/users.properties:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8082/"]
      interval: 15s
      timeout: 10s
      retries: 16
      start_period: 30s

  postgresql:
    <<: *defaults
    image: postgres:${POSTGRES_VERSION:-17.7}-alpine
    profiles: [postgresql]
    networks:
      default:
        ipv4_address: 172.18.0.22
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run infra.ps1 Init first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run infra.ps1 Init first}
      POSTGRES_DB: ${POSTGRES_DB:-dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mailpit:
    <<: *defaults
    image: axllent/mailpit:v${MAILPIT_VERSION:-1.27.4}
    profiles: [mail]
    networks:
      default:
        ipv4_address: 172.18.0.23
    mem_limit: 128m
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "1000"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6

  prometheus:
    <<: *defaults
    image: prom/prometheus:v${PROMETHEUS_VERSION:-3.5.0}
    profiles: [metrics]
    networks:
      default:
        ipv4_address: 172.18.0.24
    mem_limit: 512m
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    <<: *defaults
    image: grafana/grafana:${GRAFANA_VERSION:-12.2.0}
    profiles: [monitoring]
    networks:
      default:
        ipv4_address: 172.18.0.25
    mem_limit: 384m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run infra.ps1 Init first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  sentinel:
    <<: *defaults
    image: dev-infra/sentinel-dashboard:${SENTINEL_VERSION:-1.8.10}
    build:
      context: ./sentinel
      args:
        SENTINEL_VERSION: ${SENTINEL_VERSION:-1.8.10}
    pull_policy: build
    profiles: [flow-control]
    networks:
      default:
        ipv4_address: 172.18.0.26
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
      AUTH_USERNAME: ${SENTINEL_USER:-admin}
      AUTH_PASSWORD: ${SENTINEL_PASSWORD:?Run infra.ps1 Init first}
    command: ["--server.port=8080", "--auth.enabled=true"]
    ports:
      - "127.0.0.1:${SENTINEL_PORT:-18858}:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /version HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS= read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 20s

  seata:
    <<: *defaults
    image: apache/seata-server:${SEATA_VERSION:-2.3.0}.jdk17
    profiles: [transactions]
    networks:
      default:
        ipv4_address: 172.18.0.27
    mem_limit: 1g
    environment:
      TZ: Asia/Shanghai
      SEATA_PORT: "8091"
      STORE_MODE: file
      SERVER_NODE: "1"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_MetaspaceSize: 64m
      JVM_MaxMetaspaceSize: 192m
      JVM_MaxDirectMemorySize: 128m
      SEATA_CONSOLE_USERNAME: ${SEATA_USER:-admin}
      SEATA_CONSOLE_PASSWORD: ${SEATA_PASSWORD:?Run infra.ps1 Init first}
      SEATA_SECRET_KEY: ${SEATA_TOKEN_SECRET:?Run infra.ps1 Init first}
    ports:
      - "127.0.0.1:${SEATA_PORT:-18091}:8091"
      - "127.0.0.1:${SEATA_CONSOLE_PORT:-17091}:7091"
    volumes:
      - ./seata/application.yml:/seata-server/resources/application.yml:ro
      - seata-data:/seata-server/sessionStore
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/7091
          printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          response=$$(cat <&3)
          [[ "$${response##*$$'\r\n\r\n'}" == 'ok' ]]
      interval: 15s
      timeout: 5s
      retries: 18
      start_period: 30s

  kafka:
    <<: *defaults
    image: apache/kafka:${KAFKA_VERSION:-4.1.2}
    profiles: [streaming]
    hostname: kafka
    networks:
      default:
        ipv4_address: 172.18.0.28
    mem_limit: 1g
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 16
      start_period: 45s

# shortcut: fixed addresses avoid Rancher 1.24 stale DNAT targets; reassess after its forwarding fix.
networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16

