<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>本地项目入口</title><style>body{font:16px/1.8 system-ui,sans-serif;max-width:760px;margin:12vh auto;padding:24px;color:#34374b;background:#f6f7fb}main{background:white;padding:40px;border-radius:16px}h1{font-size:26px}code{background:#f0eff7;padding:3px 7px;border-radius:5px;font-size:14px}</style><main><h1>Nginx 本地项目入口已就绪</h1><p>将前端构建产物放入 <code>dev-infra/nginx/html</code>，即可在这里访问项目。</p><p><code>/api/</code> 请求会转发到 Windows 本机 Java 服务。后端端口由 <code>.env</code> 中的 <code>JAVA_APP_PORT</code> 指定，默认 8080。</p><p>当前页面是环境就绪页，实际业务页面需要使用你的项目构建产物。</p></main></html>
